name: Build and Release All Desktop Platforms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream stable release tag, for example v2.1.60
        required: true
        type: string
      replace_existing:
        description: Rebuild and replace assets when the fork release already exists
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release-all-${{ inputs.tag }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: iOfficeAI/AionUi

jobs:
  precheck:
    name: Check existing release
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Check fork release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-all:
    name: Build all desktop platforms
    needs: precheck
    if: needs.precheck.outputs.exists != 'true' || inputs.replace_existing
    uses: ./.github/workflows/_build-reusable.yml
    with:
      # _build-reusable.yml nominates the platform named exactly "linux-x64" as the Sentry
      # source map upload owner and hard-fails it when Sentry credentials are absent. This
      # fork has none, so the linux entry below is named "linux-x64-no-sentry" to decline
      # that role. Every other branch in the reusable workflow keys off
      # startsWith(platform, 'linux'), and the artifact name is carried by artifact-name,
      # so the build and its outputs are unchanged. Keeping the opt-out here rather than
      # patching _build-reusable.yml leaves that shared file byte-identical to upstream,
      # so syncing upstream releases never conflicts and never trips the workflow-file
      # push restriction.
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64-no-sentry","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"},
          {"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}
        ]}
      ref: ${{ inputs.tag }}
      skip_code_quality: true
      append_commit_hash: false
      upload_installers_only: true
      aioncore_run_id: ''
    secrets: inherit

  release:
    name: Create multi-platform release
    runs-on: ubuntu-latest
    needs:
      - precheck
      - build-all
    if: >-
      (needs.precheck.outputs.exists != 'true' || inputs.replace_existing) &&
      needs.build-all.result == 'success'

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build-*'
          path: release-assets
          merge-multiple: false

      - name: Verify every platform installer
        shell: bash
        run: |
          set -euo pipefail

          check_artifact() {
            local artifact="$1"
            local extension="$2"
            local directory="release-assets/$artifact"

            if [ ! -d "$directory" ]; then
              echo "::error::Missing artifact: $artifact"
              exit 1
            fi

            if ! find "$directory" -maxdepth 1 -type f -iname "*.$extension" -print -quit | grep -q .; then
              echo "::error::Artifact $artifact does not contain a .$extension installer"
              exit 1
            fi
          }

          check_artifact "macos-build-arm64" "dmg"
          check_artifact "macos-build-x64" "dmg"
          check_artifact "windows-build-x64" "exe"
          check_artifact "windows-build-arm64" "exe"
          check_artifact "linux-build-x64" "deb"
          check_artifact "linux-build-arm64" "deb"

          echo "Verified release files:"
          find release-assets -type f -print

      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          {
            echo "Automatically built desktop installers for:"
            echo
            echo "- Windows x64 and ARM64"
            echo "- macOS x64 and ARM64"
            echo "- Linux x64 and ARM64"
            echo
            echo "Upstream release:"
            echo "https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "---"
            echo
            gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${TAG}" --jq '.body // ""'
          } > release-notes.md

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          PRERELEASE=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')

          RELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          mapfile -d '' RELEASE_FILES < <(find release-assets -type f -print0)

          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "::error::No release files found"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.replace_existing }}" != "true" ]; then
              echo "::error::Release $TAG already exists and replace_existing is false"
              exit 1
            fi

            gh release upload "$TAG" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG Multi-platform" --notes-file release-notes.md
            echo "Release assets updated:"
          else
            gh release create "$TAG" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --title "$TAG Multi-platform" --notes-file release-notes.md --verify-tag "${RELEASE_ARGS[@]}"
            echo "Release created:"
          fi

          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
